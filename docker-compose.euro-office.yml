# Sovereign European EuroOffice / Collabora Online (CODE) Web Suite
# 100% Free and Open Source (MPLv2)
# Zero license keys, zero connection limits, zero paywall modals.
#
# To run:
#   docker compose -f docker-compose.euro-office.yml up -d
#
services:
  eurooffice:
    image: collabora/code:latest
    container_name: ethiooffice_eurooffice
    restart: unless-stopped
    environment:
      - aliasgroup1=http://host.docker.internal:8000,http://127.0.0.1:8000,http://localhost:8000,http://localhost:5174,http://127.0.0.1:5174
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false --o:net.content_security_policy="frame-ancestors *;" --o:net.post_allow.host[0]=.*
      - DONT_GEN_SSL_CERT=true
    ports:
      - "9980:9980"
    extra_hosts:
      - "host.docker.internal:host-gateway"
